<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bienvenida 2.0 · prototipo local</title>
<link rel="stylesheet" href="../../riso/riso.css">
<style>
:root{--f:#FBF8F2;--p:#fff;--t1:#1B2333;--t2:#5B6472;--l:#E7E2D6;--a:#3554F0;--at:#EEF1FE;--v:#1FA463;--vt:#E7F7EE;--r:#EF5A45;--rt:#FDEBE8}
@media (prefers-color-scheme:dark){:root{--f:#0B0F1A;--p:#141A29;--t1:#EEF0F7;--t2:#AAB1C4;--l:#262E42;--a:#7C8FFF;--at:#1D2550;--v:#25C27C;--vt:#10301F;--r:#FF6655;--rt:#3A1A17}}
*{box-sizing:border-box}body{margin:0;background:var(--f);color:var(--t1);font:16px/1.5 'Nunito',system-ui,sans-serif}
.nota{font-size:13px;color:var(--t2);text-align:center;padding:8px}
.caja{max-width:460px;margin:0 auto;padding:16px 16px 32px;min-height:calc(100dvh - 40px);display:flex;flex-direction:column}
.prog{display:flex;gap:6px;margin:4px 0 18px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--l)}.prog i.on{background:var(--a)}
.cab{display:flex;gap:12px;align-items:center;margin-bottom:12px}.cab .av{width:64px;flex:none}
h1{font:700 24px/1.2 'Baloo 2',system-ui,sans-serif;margin:0}
.sub{color:var(--t2);margin:4px 0 0;font-size:15px}
.ops{display:grid;gap:10px;margin-top:16px}
.op{border:2px solid var(--l);background:var(--p);border-radius:16px;padding:14px 16px;text-align:left;font-family:inherit;font-weight:800;font-size:17px;line-height:1.3;color:inherit;cursor:pointer;min-height:56px}
.op:hover{border-color:var(--a)}.op:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.op.bien{border-color:var(--v);background:var(--vt)}.op.mal{border-color:var(--r);background:var(--rt)}
.frase{font:700 22px/1.35 'Baloo 2',system-ui,sans-serif;margin:8px 0 0}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:15px}
.pie{margin-top:auto;padding-top:20px;display:flex;justify-content:space-between;align-items:center}
.saltar{background:none;border:0;color:var(--t2);font-weight:700;cursor:pointer;min-height:44px;padding:0 8px}
.cta{border:0;border-radius:999px;background:var(--a);color:#fff;font-weight:800;padding:14px 22px;cursor:pointer;min-height:48px}
.cta:disabled{opacity:.4}
.plan{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:16px;margin-top:16px}
.plan li{margin:6px 0}
</style>
</head>
<body>
<div class="nota">Prototipo local de la bienvenida 2.0 (versión 2). No guarda nada.</div>
<main class="caja" id="app" aria-live="polite"></main>
<script src="../../riso/riso.js"></script>
<script>
(function(){
  var app = document.getElementById('app'), paso = 0, datos = {}, riso;
  var NIVEL = [
    { f:'She ___ coffee every morning.', o:['drink','drinks','drinking'], c:1 },
    { f:'I have lived here ___ 2019.', o:['for','since','from'], c:1 },
    { f:'If I ___ more time, I would travel.', o:['have','had','will have'], c:1 }
  ];
  var nq = 0, aciertos = 0;
  function el(h){ var d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; }
  function cab(titulo, sub, estado){
    return '<div class="prog">' + [0,1,2,3].map(function(i){ return '<i class="' + (i <= paso ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
      '<div class="cab"><div class="av" id="av"></div><div><h1 tabindex="-1">' + titulo + '</h1>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div></div>';
  }
  function montar(estado){ riso = Riso.montar(document.getElementById('av'), { estado: estado, alto: 72, etiqueta: '' }); app.querySelector('h1').focus({ preventScroll:true }); }
  function opciones(lista, fn){ var c = el('<div class="ops"></div>'); lista.forEach(function(t, i){ var b = el('<button type="button" class="op"></button>'); b.textContent = t; b.onclick = function(){ fn(i, b, c); }; c.appendChild(b); }); return c; }
  function pie(saltar){ var p = el('<div class="pie"><button type="button" class="saltar">Saltar</button><span></span></div>'); p.firstChild.onclick = saltar; return p; }
  var PASOS = [
    function(){ // 1 primera pregunta
      app.innerHTML = cab('Tu primera pregunta', 'Sin registrarte. Es el primer ejercicio de tu práctica gratis: cuenta una sola vez.');
      montar('bienvenida');
      app.appendChild(el('<p class="frase">___ she work on Saturdays?</p>'));
      app.appendChild(opciones(['Is','Does','Do'], function(i, b, c){
        c.querySelectorAll('.op').forEach(function(x){ x.disabled = true; });
        var ok = i === 1; b.classList.add(ok ? 'bien' : 'mal'); if (!ok) c.children[1].classList.add('bien');
        riso.estado(ok ? 'celebracion' : 'neutro');
        app.appendChild(el('<div class="fb" style="background:var(--' + (ok ? 'vt' : 'rt') + ')">' + (ok ? '¡Bien! Con she, he e it la pregunta empieza con <b>Does</b>.' : 'Casi. Con she, he e it la pregunta empieza con <b>Does</b>, porque work es un verbo de acción.') + '</div>'));
        var p = pie(siguiente); var b2 = el('<button type="button" class="cta">Seguir</button>'); b2.onclick = siguiente; p.replaceChild(b2, p.lastChild); app.appendChild(p);
      }));
    },
    function(){ // 2 objetivo
      app.innerHTML = cab('¿Para qué quieres el inglés?', 'Así elijo tus ejemplos.');
      montar('neutro');
      app.appendChild(opciones(['Para mi trabajo','Para una entrevista','Para viajar','Para un examen','Para conversar'], function(i, b){ datos.meta = b.textContent; siguiente(); }));
      app.appendChild(pie(siguiente));
    },
    function(){ // 3 nivel en 3 preguntas
      var q = NIVEL[nq];
      app.innerHTML = cab('¿Por dónde empezamos?', 'Opcional. Pregunta ' + (nq + 1) + ' de 3: así elegimos la dificultad de tu práctica. No es un examen.');
      montar('pensando');
      app.appendChild(el('<p class="frase"></p>')).textContent = q.f;
      app.appendChild(opciones(q.o, function(i){ if (i === q.c) aciertos++; nq++; if (nq < 3) PASOS[2](); else { datos.nivel = ['Principiante','Fácil','Medio','Medio'][aciertos]; siguiente(); } }));
      var p = pie(siguiente); var t = el('<a href="../../test-de-nivel-de-ingles.html" style="color:var(--a);font-weight:700">Hacer el test completo</a>'); p.replaceChild(t, p.lastChild); app.appendChild(p);
    },
    function(){ // 4 minutos
      app.innerHTML = cab('¿Cuántos minutos al día?', 'Puedes cambiarlo cuando quieras.');
      montar('neutro');
      app.appendChild(opciones(['5 minutos','10 minutos','20 minutos'], function(i, b){ datos.min = b.textContent; siguiente(); }));
      app.appendChild(pie(siguiente));
    },
    function(){ // plan
      app.innerHTML = '<div class="cab"><div class="av" id="av"></div><div><h1 tabindex="-1">Tu plan de hoy</h1><p class="sub">Listo. Empezamos por lo que más te sirve.</p></div></div>';
      montar('celebracion');
      app.appendChild(el('<div class="plan"><ul>' +
        '<li>Te mostraremos primero: <b>' + ({ 'Para mi trabajo':'inglés para el trabajo y reuniones', 'Para una entrevista':'preguntas de entrevista', 'Para viajar':'aeropuerto, hotel y restaurante', 'Para un examen':'preparación TOEFL, IELTS y TOEIC', 'Para conversar':'conversación del día a día' }[datos.meta] || 'lo esencial para empezar') + '</b></li>' +
        '<li>Dificultad para empezar: <b>' + (datos.nivel || 'Fácil') + '</b> <small>(la cambias cuando quieras; tu nivel real lo mide el test de nivel)</small></li>' +
        '<li>Meta diaria: <b>' + (datos.min || '10 minutos') + '</b></li>' +
        '<li>Reto de hoy: terminar 1 sesión (+50 XP)</li></ul></div>'));
      var p = el('<div class="pie"><span></span><button type="button" class="cta">Empezar mi práctica</button></div>'); app.appendChild(p);
    }
  ];
  function siguiente(){ paso = Math.min(paso + 1, 4); PASOS[paso](); }
  PASOS[0]();
})();
</script>
</body>
</html>
