<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<title>Pregúntale a Riso · Inglés con Leo</title>
<meta name="theme-color" content="#FBF8F2">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="riso/riso.css?v=20261128a">
<style>
:root{--fondo:#FBF8F2;--panel:#fff;--t1:#1B2333;--t2:#5B6472;--linea:#E7E2D6;--azul:#3554F0;--azul-t:#EEF1FE;--rojo:#C8372D;--rojo-t:#FDEBE8;--verde:#1FA463;--verde-t:#E7F7EE;--ambar-t:#FFF4E0}
@media (prefers-color-scheme:dark){:root{--fondo:#0B0F1A;--panel:#141A29;--t1:#EEF0F7;--t2:#AAB1C4;--linea:#262E42;--azul:#7C8FFF;--azul-t:#1D2550;--rojo:#FF7A6B;--rojo-t:#3A1A17;--verde:#25C27C;--verde-t:#10301F;--ambar-t:#3A2F12}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--t1);font:16px/1.5 'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,textarea{font:inherit;color:inherit}
.barra{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--linea)}
.barra a{color:var(--t2);text-decoration:none;font-weight:700;font-size:14px}
.app{max-width:1080px;margin:0 auto;padding:12px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.app{grid-template-columns:minmax(0,1fr) 420px;align-items:start}}
.tarjeta{background:var(--panel);border:1px solid var(--linea);border-radius:20px;padding:16px}
.estado{max-width:520px;margin:40px auto;text-align:center}
.ej h2{font-weight:800;font-size:13px;line-height:1.2;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);margin:0 0 8px}
.ej-tema{color:var(--t2);font-size:14px;margin:0 0 6px}
.ej-frase{font:700 21px/1.35 'Baloo 2',system-ui,sans-serif;margin:0 0 12px}
.ej-ops{display:flex;gap:8px;flex-wrap:wrap}
.ej-op{border:2px solid var(--linea);border-radius:14px;padding:8px 16px;background:var(--panel);font-weight:800;cursor:pointer;min-height:44px}
.ej-op.mal{border-color:var(--rojo);background:var(--rojo-t)}.ej-op.bien{border-color:var(--verde);background:var(--verde-t)}
.ej-fb{margin-top:12px;font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;background:var(--azul);color:#fff;font-weight:800;cursor:pointer;min-height:44px}
.btn.sec{background:transparent;color:var(--azul);border:1px solid var(--linea)}
.btn:focus-visible,.chip:focus-visible,.ej-op:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
@media (prefers-color-scheme:dark){.btn{color:#0B0F1A}}
.tutor{background:var(--panel);border:1px solid var(--linea);border-radius:24px;display:flex;flex-direction:column;height:calc(100dvh - 90px);min-height:440px;overflow:hidden}
@media (min-width:900px){.tutor{position:sticky;top:12px;height:min(740px,calc(100dvh - 90px))}}
.t-cab{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--linea)}
.t-cab .avatar{width:58px;height:70px;flex:none}
.t-cab h1{font:800 20px/1.1 'Baloo 2',system-ui,sans-serif;margin:0}.t-cab p{margin:2px 0 0;font-size:13px;color:var(--t2)}
.t-ctx{margin:10px 16px 0;padding:8px 12px;border-radius:12px;background:var(--ambar-t);font-size:13px;display:none;gap:8px;align-items:center}
.t-ctx.on{display:flex}.t-ctx button{margin-left:auto;border:0;background:none;color:var(--azul);font-weight:800;cursor:pointer}
.t-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.m{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.m-al{align-self:flex-end;background:var(--azul);color:#fff;border-bottom-right-radius:6px}
@media (prefers-color-scheme:dark){.m-al{color:#0B0F1A}}
.m-ri{align-self:flex-start;background:var(--fondo);border:1px solid var(--linea);border-bottom-left-radius:6px}
.m-ri .ej{margin-top:8px;padding:8px 10px;border-left:3px solid var(--azul);background:var(--panel);border-radius:8px;white-space:normal}
.m-ri .ej .en{font-weight:800}.m-ri .ej .es{color:var(--t2);font-size:14px}
.m-ri .ref{display:inline-block;margin-top:8px;font-weight:800;color:var(--azul);text-decoration:none;white-space:normal}
.m-ri .aviso{margin-top:6px;font-size:11px;color:var(--t2)}
.m-error{background:var(--rojo-t);border-color:transparent}
.reint{margin-top:8px;border:1px solid var(--rojo);background:transparent;border-radius:999px;padding:4px 12px;font-weight:800;cursor:pointer;min-height:36px}
.pensando{align-self:flex-start;color:var(--t2);font-size:14px}
.t-sug{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.t-sug::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linea);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap;min-height:36px}
.t-form{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--linea)}
.t-form textarea{flex:1;resize:none;border:1px solid var(--linea);border-radius:16px;padding:10px 12px;background:var(--fondo);font-size:16px;max-height:120px;min-height:44px;line-height:1.4}
.t-form textarea:focus{outline:2px solid var(--azul);border-color:transparent}
.enviar{border:0;border-radius:50%;width:44px;height:44px;background:var(--azul);color:#fff;cursor:pointer;flex:none;display:grid;place-items:center}
.enviar:disabled{opacity:.45;cursor:default}
.t-pie{display:flex;justify-content:space-between;padding:0 16px 8px;font-size:12px;color:var(--t2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="barra"><a href="miembros.html">← Volver a la academia</a></div>
<div id="raiz"><p class="estado" id="cargando">Cargando…</p></div>

<template id="tplApp">
<main class="app">
  <section class="tarjeta ej" aria-labelledby="ejT">
    <h2 id="ejT">Practica y pregúntale a Riso</h2>
    <p class="ej-tema" id="ejTema"></p>
    <p class="ej-frase" id="ejFrase"></p>
    <div class="ej-ops" id="ejOps"></div>
    <div class="ej-fb" id="ejFb" aria-live="polite"></div>
    <p style="margin:12px 0 0;display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn" id="ejRiso" hidden>Pregúntale a Riso sobre este ejercicio</button>
      <button type="button" class="btn sec" id="ejOtro">Otro ejercicio</button>
    </p>
  </section>
  <section class="tutor" id="tutor" aria-labelledby="tT">
    <header class="t-cab"><div class="avatar" id="avatar" aria-hidden="true"></div><div><h1 id="tT">Pregúntale a Riso</h1><p>Tu tutor de inglés con inteligencia artificial</p></div></header>
    <div class="t-ctx" id="ctx"><span id="ctxTxt"></span><button type="button" id="ctxQuitar">Quitar</button></div>
    <div class="t-msgs" id="msgs" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="Conversación con Riso"></div>
    <div class="t-sug" id="sug" aria-label="Sugerencias"></div>
    <form class="t-form" id="form" autocomplete="off">
      <label for="q" class="sr">Escribe tu pregunta para Riso</label>
      <textarea id="q" rows="1" maxlength="400" placeholder="Escribe tu duda de inglés" enterkeyhint="send"></textarea>
      <button class="enviar" id="enviar" type="submit" aria-label="Enviar pregunta" disabled><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h11M10 5l5 5-5 5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
    <div class="t-pie"><span id="cuota"></span><span id="cont">0/400</span></div>
  </section>
</main>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="backend.js?v=20261201a"></script>
<script src="riso/riso.js?v=20261128a"></script>
<script src="riso/riso-gl.js?v=20261128a"></script>
<script src="riso/tutor/conocimiento.js?v=20261128a"></script>
<script src="riso/tutor/riso-tutor.js?v=20261128a"></script>
<script src="riso/tutor/riso-cliente.js?v=20261128a"></script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var raiz = $('raiz');
  function aviso(html){ raiz.innerHTML = '<div class="tarjeta estado">' + html + '</div>'; }

  async function estado(session){
    try{
      var r = await fetch(SUPABASE_URL + '/functions/v1/leo-ai', { method:'POST', headers:{ 'Authorization':'Bearer ' + session.access_token, 'Content-Type':'application/json' }, body: JSON.stringify({ mode:'chat_status' }) });
      var d = await r.json().catch(function(){ return null; });
      return d && d.riso ? d.riso : { enabled:false };
    }catch(e){ return { enabled:false, red:true }; }
  }

  async function iniciar(){
    var session = null;
    try{ session = await LeoBackend.getSession(); }catch(e){}
    if(!session){ aviso('<p>Para hablar con Riso, entra a tu cuenta.</p><p><a class="btn" href="miembros.html">Entrar</a></p>'); return; }
    var st = await estado(session);
    if(!st.enabled){ aviso(st.red ? '<p>No pude conectarme. Revisa tu conexión y vuelve a intentar.</p>' : '<p>Riso todavía no está disponible para tu cuenta.</p>'); return; }
    raiz.innerHTML = ''; raiz.appendChild($('tplApp').content.cloneNode(true));
    app(st, session);
  }

  function app(st){
    var monta = (window.RisoGL || window.Riso);
    var avatar = monta ? monta.montar($('avatar'), { estado:'bienvenida', alto:70, etiqueta:'' }) : null;
    var reposo = null;
    function despierta(e){ if(!avatar) return; avatar.quieto(false); if(e) avatar.estado(e); clearTimeout(reposo); reposo = setTimeout(function(){ avatar.quieto(true); }, 15000); } // sin animación permanente
    despierta();
    var plan = st.member ? 'miembro' : 'gratis';
    RisoTutor.CONFIG.cuotaDiaria[plan] = st.cupo || 0;
    var tutor = RisoTutor.crear({ plan: plan, usadasHoy: st.usadas || 0, generar: RisoTutor.generarConServidor(LeoBackend) });
    var ctx = null, ocupado = false, ultima = null;
    window.__risoLog = []; // solo en memoria, para revisar el piloto en esta pestaña; nunca se envía a Analytics

    function el(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
    function bajar(){ var m = $('msgs'); m.scrollTop = m.scrollHeight; }
    function alumno(t){ $('msgs').appendChild(el('div', 'm m-al', t)); bajar(); }
    function riso(r){
      var d = el('div', 'm m-ri' + (r.tipo === 'error' ? ' m-error' : ''));
      d.appendChild(el('div', null, r.texto));
      (r.ej || []).slice(0, 2).forEach(function(e){ if(!e || !e[0]) return; var b = el('div', 'ej'); b.appendChild(el('div', 'en', e[0])); if(e[1]) b.appendChild(el('div', 'es', e[1])); d.appendChild(b); });
      if(r.ref){ var a = el('a', 'ref', 'Lee la guía' + (r.refTitulo ? ': ' + r.refTitulo.split('(')[0].split(':')[0].trim() : '')); a.href = r.ref; d.appendChild(a); }
      if(r.enlace){ var s = el('a', 'ref', 'Ir a Soporte'); s.href = r.enlace; d.appendChild(s); }
      if(r.aviso) d.appendChild(el('div', 'aviso', '✦ ' + r.aviso));
      if(r.reintentar){ var b2 = el('button', 'reint', 'Reintentar'); b2.type = 'button'; b2.onclick = function(){ d.remove(); enviar(ultima, true); }; d.appendChild(b2); }
      $('msgs').appendChild(d); bajar();
    }
    function cuota(){ var m = tutor.metricas(); $('cuota').textContent = 'Preguntas abiertas hoy: ' + m.usadasHoy + ' de ' + (st.cupo || 0); }
    function sugerencias(){
      var s = ctx ? ['¿Por qué está mal mi respuesta?', 'Dame otro ejemplo', 'Explícamelo más fácil'] : ['¿Cuándo uso do y does?', 'Pasado de go', '¿Cómo se dice 7:45?', '¿Cómo le digo a mi jefe que llegaré tarde?'];
      var c = $('sug'); c.innerHTML = '';
      s.forEach(function(t){ var b = el('button', 'chip', t); b.type = 'button'; b.onclick = function(){ enviar(t); }; c.appendChild(b); });
    }
    async function enviar(t, reintento){
      t = String(t || '').trim(); if(!t || ocupado) return;
      ultima = t; ocupado = true; $('enviar').disabled = true;
      if(!reintento) alumno(t);
      $('q').value = ''; ajustar();
      var p = el('div', 'pensando', 'Riso está pensando…'), timer = setTimeout(function(){ $('msgs').appendChild(p); bajar(); despierta('pensando'); }, 250);
      var t0 = performance.now();
      var r = await tutor.preguntar(t, ctx);
      var ms = Math.round(performance.now() - t0);
      clearTimeout(timer); p.remove();
      despierta(r.tipo === 'gracias' ? 'celebracion' : 'neutro');
      window.__risoLog.push({ pregunta: t, contexto: ctx ? ctx.itemId : null, capa: r.capa, tipo: r.tipo, ms: ms, respuesta: r.texto, ejemplo: r.ej && r.ej[0] ? r.ej[0].join(' / ') : '', guia: r.ref || '' });
      riso(r); ocupado = false; ajustar(); cuota();
    }
    function ajustar(){ var q = $('q'); q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 120) + 'px'; $('cont').textContent = q.value.length + '/400'; $('enviar').disabled = ocupado || !q.value.trim(); }
    $('q').addEventListener('input', function(){ ajustar(); despierta(); });
    $('q').addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); enviar($('q').value); } });
    $('q').addEventListener('focus', function(){ setTimeout(bajar, 300); });
    $('form').addEventListener('submit', function(e){ e.preventDefault(); enviar($('q').value); });
    window.__risoEnviar = enviar;

    // ---- ejercicio de práctica (para el modo «sobre el ejercicio») ----
    var indice = null, actual = null;
    function ponerContexto(c){
      ctx = c; $('ctx').classList.toggle('on', !!c);
      if(c) $('ctxTxt').textContent = 'Hablando del ejercicio: «' + c.enunciado + '»';
      sugerencias();
    }
    $('ctxQuitar').onclick = function(){ ponerContexto(null); };
    async function nuevoEjercicio(){
      if(!indice){ try{ indice = await (await fetch('supabase/functions/leo-ai/riso-ejercicios.json')).json(); }catch(e){ indice = {}; } }
      var ids = Object.keys(indice).filter(function(k){ return (indice[k].o && indice[k].o.length > 1) || indice[k].k === 'error'; });
      if(!ids.length){ $('ejFrase').textContent = 'No pude cargar los ejercicios.'; return; }
      var id = ids[Math.floor(Math.random() * ids.length)], it = indice[id];
      actual = { id: id, it: it };
      $('ejTema').textContent = it.t; $('ejFrase').textContent = it.e; $('ejFb').textContent = ''; $('ejRiso').hidden = true;
      var ops = $('ejOps'); ops.innerHTML = '';
      if(it.k === 'error'){
        // Igual que la práctica real (app.js, tipo 'error'): se toca la palabra incorrecta; acierta si cae dentro de la marcada.
        $('ejFrase').textContent = 'Encuentra el error, toca la palabra incorrecta';
        it.p.forEach(function(w, i){
          var b = el('button', 'ej-op', w); b.type = 'button';
          b.onclick = async function(){
            var dentro = function(j){ return j >= it.s[0] && j <= it.s[1]; };
            ops.querySelectorAll('button').forEach(function(x, j){ x.disabled = true; if(dentro(j)) x.classList.add('bien'); });
            var ok = dentro(i); if(!ok) b.classList.add('mal');
            $('ejFb').textContent = (ok ? '¡Bien! ' : 'La palabra incorrecta es «' + it.c + '». ') + 'Frase correcta: ' + it.f;
            try{ await LeoBackend.getClient().rpc('riso_registrar_intento', { p_item: id, p_respuesta: String(i) }); }catch(e){}
            actual.respuesta = String(i); actual.palabra = w; $('ejRiso').hidden = false;
          };
          ops.appendChild(b);
        });
        return;
      }
      it.o.slice().sort(function(){ return Math.random() - .5; }).forEach(function(o){
        var b = el('button', 'ej-op', o); b.type = 'button';
        b.onclick = async function(){
          ops.querySelectorAll('button').forEach(function(x){ x.disabled = true; if(x.textContent.toLowerCase() === it.c.toLowerCase()) x.classList.add('bien'); });
          var ok = o.toLowerCase() === it.c.toLowerCase(); if(!ok) b.classList.add('mal');
          $('ejFb').textContent = ok ? '¡Bien!' : 'La respuesta correcta es «' + it.c + '».';
          try{ await LeoBackend.getClient().rpc('riso_registrar_intento', { p_item: id, p_respuesta: o }); }catch(e){}
          actual.respuesta = o; $('ejRiso').hidden = false;
        };
        ops.appendChild(b);
      });
    }
    $('ejOtro').onclick = nuevoEjercicio;
    $('ejRiso').onclick = function(){
      if(!actual || !actual.respuesta) return;
      ponerContexto({ itemId: actual.id, fuente: 'practica', tema: actual.it.t, enunciado: actual.it.e, respuestaAlumno: actual.respuesta, respuestaCorrecta: actual.it.c });
      if(actual.it.k === 'error') $('ctxTxt').textContent = 'Hablando del ejercicio: «' + actual.it.e + '» (tocaste «' + actual.palabra + '»)';
      riso({ capa: 1, texto: 'Vi tu respuesta. ¿Qué parte no te quedó clara?' });
      $('q').focus({ preventScroll: true });
      if(matchMedia('(max-width: 899px)').matches) $('tutor').scrollIntoView({ block: 'start' });
    };
    nuevoEjercicio();
    riso({ capa: 1, texto: '¡Hola! Soy Riso, tu tutor de inglés con inteligencia artificial. Pregúntame una palabra, una regla o cómo decir algo.' });
    sugerencias(); cuota();
  }
  iniciar();
})();
</script>
</body>
</html>
