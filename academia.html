<script>
(function(){
  var burger = document.querySelector('.nav-burger'), links = document.querySelector('.nav-links');
  if(!burger || !links) return;
  burger.setAttribute('aria-expanded','false');
  var setOpen = function(o){ links.classList.toggle('mnav-open', o); burger.setAttribute('aria-expanded', o ? 'true' : 'false'); };
  burger.addEventListener('click', function(e){ e.stopPropagation(); setOpen(!links.classList.contains('mnav-open')); });
  links.addEventListener('click', function(e){ if(e.target.closest('a')) setOpen(false); });
  document.addEventListener('click', function(e){ if(!e.target.closest('.nav-links') && !e.target.closest('.nav-burger')) setOpen(false); });
  window.addEventListener('resize', function(){ if(window.innerWidth >= 900) setOpen(false); });
})();
</script>
