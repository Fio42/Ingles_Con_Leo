name: Site Health

# Auditoría diaria de SEO/rendimiento/salud técnica de inglesconleo.com.
# Es de SOLO LECTURA sobre el sitio publicado (solo hace peticiones GET/
# HEAD contra la web en vivo, nunca la modifica). Lo único que este
# workflow escribe es SITE_HEALTH_REPORT.md y tools/site-health/history.json
# EN ESTE REPO, para poder avisar "esto se rompió hoy" en vez de solo
# mostrar una foto del día. No corrige nada automáticamente: si hay
# problemas, hay que arreglarlos a mano después de leer el reporte.
#
# No usa ningún secret: todos los chequeos (crawler + Lighthouse) son
# contra la web pública, sin login ni credenciales.

on:
  schedule:
    - cron: '0 12 * * *' # una vez al día, 6am hora de Cancun (UTC-6/-5)
  workflow_dispatch: {} # tambien se puede correr a mano desde la pestaña Actions

permissions:
  contents: write # necesario para poder subir el reporte/historial actualizados

concurrency:
  group: site-health-report-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del auditor
        working-directory: tools/site-health
        run: npm install

      - name: Instalar Lighthouse
        run: npm install -g lighthouse

      - name: Correr Lighthouse en las páginas clave
        working-directory: tools/site-health
        run: node run-lighthouse.js

      - name: Correr la auditoría y generar el reporte
        working-directory: tools/site-health
        run: node audit.js

      # SITE_HEALTH_REPORT.md y history.json son archivos GENERADOS: cada
      # corrida los reescribe completos a partir del historial anterior.
      # Por eso un "git pull --rebase" daba conflicto siempre que otra
      # corrida (o un push manual) tocara los mismos archivos mientras esta
      # auditaba. En vez de rebasar y resolver a mano, si main avanzó se
      # parte del main nuevo (con su historial al día), se regenera el
      # reporte encima con los datos ya recolectados (Lighthouse queda en
      # lighthouse-raw, que git no toca) y se vuelve a intentar. Así ninguna
      # corrida se pierde ni se pisa.
      - name: Subir el reporte y el historial actualizados
        run: |
          git config user.name "site-health-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git add SITE_HEALTH_REPORT.md tools/site-health/history.json
            if git diff --cached --quiet; then
              echo "Sin cambios en el reporte, no hay nada que subir."
              exit 0
            fi
            git commit -m "Site Health: actualizar reporte automático"

            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              # main no avanzó desde el checkout: el push es directo
              if git push origin HEAD:main; then
                echo "Reporte subido (intento $attempt)."
                exit 0
              fi
            fi

            echo "main avanzó (intento $attempt): se regenera el reporte sobre el historial más reciente."
            git reset --hard origin/main
            (cd tools/site-health && node audit.js)
          done

          echo "No se pudo subir el reporte tras 5 intentos."
          exit 1
