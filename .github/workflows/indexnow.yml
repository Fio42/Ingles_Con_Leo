name: IndexNow ping

# Avisa a Bing (via api.indexnow.org) y a Yandex de las paginas .html que
# cambiaron en este push. No hace falta ningun secreto: IndexNow solo pide
# que el archivo de la clave este publicado en el propio sitio
# (41c1350951c5e79e95e8a4d0b5c84112.txt en la raiz del repo).
#
# - Push normal: manda SOLO las paginas .html nuevas o modificadas.
# - "Run workflow" a mano: manda todas las URLs del sitemap.xml.
# - El job FALLA (rojo) y muestra la respuesta si algun buscador contesta
#   4xx/5xx. 200 y 202 cuentan como exito.
# - Excepcion: HTTP 403 de api.indexnow.org (Bing, problema externo conocido)
#   se muestra como warning amarillo y NO hace fallar el job.
#
# Google NO usa IndexNow (solo Bing/Yandex/Seznam/Naver), asi que esto no
# reemplaza al sitemap.xml ni a Google Search Console.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
  workflow_dispatch: {}

jobs:
  ping-indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Avisar a IndexNow (falla si hay 4xx/5xx)
        run: |
          KEY="41c1350951c5e79e95e8a4d0b5c84112"
          HOST="inglesconleo.com"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<loc>//;s#</loc>##')
          else
            urls=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.html' \
              | sed -E 's#(^|/)index\.html$#\1#; s#^#https://'"$HOST"'/#')
          fi
          if [ -z "$urls" ]; then
            echo "Ninguna pagina .html nueva o cambiada: nada que avisar."
            exit 0
          fi
          echo "URLs a enviar:"; printf '%s\n' "$urls"
          json_urls=$(printf '%s\n' "$urls" | jq -R . | jq -s .)
          payload=$(jq -n --arg host "$HOST" --arg key "$KEY" --argjson urlList "$json_urls" \
            '{host:$host, key:$key, keyLocation:("https://" + $host + "/" + $key + ".txt"), urlList:$urlList}')
          fail=0
          for ep in https://api.indexnow.org/indexnow https://yandex.com/indexnow; do
            code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST "$ep" \
              -H "Content-Type: application/json; charset=utf-8" --data "$payload") || code=000
            echo "$ep -> HTTP $code"; cat resp.txt; echo
            case "$code" in
              200|202) ;;
              403)
                if [ "$ep" = "https://api.indexnow.org/indexnow" ]; then
                  echo "::warning::IndexNow (Bing) responde HTTP 403 en $ep: problema externo conocido, no se marca como fallo"
                else
                  echo "::error::IndexNow fallo en $ep con HTTP $code"; fail=1
                fi ;;
              *) echo "::error::IndexNow fallo en $ep con HTTP $code"; fail=1 ;;
            esac
          done
          exit $fail
